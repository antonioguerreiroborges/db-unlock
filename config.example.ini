; Copy next to db-unlock.exe as config.ini, or run "db-unlock.exe setup".
; password_encrypted is produced by "setup" (Windows DPAPI) and only works
; for the Windows user and machine that created it.

[database]
host = 192.168.0.10
port = 3306
user = app_user
password_encrypted =
; User whose connections are killed. Empty = same as "user".
target_user =

[run]
; Connection attempts at startup (network may not be ready right after logon).
retries = 5
retry_delay_seconds = 10
connect_timeout = 10
